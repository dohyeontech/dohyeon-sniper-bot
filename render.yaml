services:
  - type: web
    name: dohyeon-sniper-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: false   # 수동 배포: Render 대시보드 > Clear build cache & deploy
